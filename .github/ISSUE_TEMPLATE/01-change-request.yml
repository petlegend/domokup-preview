name: 수정 요청
description: 미리보기 화면을 보고 고칠 점을 적어 주세요
title: "[수정] "
labels: ["수정 요청"]
body:
  - type: markdown
    attributes:
      value: |
        미리보기 주소: https://petlegend.github.io/domokup-preview/
        🔴 고객 개인정보·비밀번호는 적지 마세요 (이 저장소는 공개입니다).

  - type: input
    id: page
    attributes:
      label: 어느 페이지인가요
      description: 주소를 붙여넣거나 페이지 이름을 적어 주세요
      placeholder: "예: https://petlegend.github.io/domokup-preview/catalog/ 또는 「상품 목록」"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: 어느 기기에서 봤나요
      multiple: true
      options:
        - 휴대폰
        - 태블릿
        - PC
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 무엇이 문제인가요
      placeholder: "예: 상단 배너 글씨가 너무 작아서 안 읽힌다"
    validations:
      required: true

  - type: textarea
    id: wanted
    attributes:
      label: 원하는 모습
      placeholder: "예: 글씨를 두 배 크게, 배경은 흰색으로"
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷
      description: 사진을 이 칸에 끌어다 놓거나 붙여넣으세요 (계정·메일함이 찍힌 부분은 가려 주세요)
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 급한 정도
      options:
        - 보통
        - 급함 (승인 전에 꼭 고쳐야 함)
        - 나중에
    validations:
      required: false
